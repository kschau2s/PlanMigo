services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-planmigo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planmigo}
      POSTGRES_DB: ${POSTGRES_DB:-planmigo}
    volumes:
      - planmigo-db-data:/var/lib/postgresql/data
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-planmigo} -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://planmigo:planmigo@127.0.0.1:5432/planmigo
    network_mode: host
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    env_file:
      - .env
    network_mode: host
    depends_on:
      - backend

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-change-me}
      PLANMIGO_BACKEND_URL: http://127.0.0.1:8000/api/v1
    volumes:
      - ./openwebui:/app/backend/data/pipelines
      - planmigo-openwebui-data:/app/backend/data
    network_mode: host
    depends_on:
      - backend

networks:
  planmigo-net:
    driver: bridge

volumes:
  planmigo-db-data:
  planmigo-openwebui-data:
